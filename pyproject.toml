[project]
name = "safe-it-ops-incident-agent"
version = "0.1.0"
description = "Local-first incident investigation and safe remediation simulator"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "langgraph>=0.3,<2",
    "chromadb>=0.6,<2",
    "sentence-transformers>=3.4,<6",
    "rank-bm25>=0.2,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
