services:
  incident-agent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      INCIDENT_AGENT_DATABASE_URL: sqlite:////app/data/incidents.db
      KNOWLEDGE_BASE_DIR: /app/knowledge_base
      RETRIEVAL_VECTOR_DIR: /app/data/chroma
      RETRIEVAL_BM25_DIR: /app/data/bm25
      RETRIEVAL_COLLECTION_NAME: ${RETRIEVAL_COLLECTION_NAME:-operational_knowledge}
      RETRIEVAL_EMBEDDING_MODEL: ${RETRIEVAL_EMBEDDING_MODEL:-local-hash-v1}
      RETRIEVAL_EMBEDDING_MODEL_PATH: ${RETRIEVAL_EMBEDDING_MODEL_PATH:-}
      RETRIEVAL_CHUNK_SIZE: ${RETRIEVAL_CHUNK_SIZE:-220}
      RETRIEVAL_CHUNK_OVERLAP: ${RETRIEVAL_CHUNK_OVERLAP:-40}
      RETRIEVAL_CHUNKING_STRATEGY: ${RETRIEVAL_CHUNKING_STRATEGY:-structure}
      RETRIEVAL_RRF_CONSTANT: ${RETRIEVAL_RRF_CONSTANT:-60}
    volumes:
      - incident_data:/app/data
      - type: bind
        source: ${RETRIEVAL_MODEL_HOST_DIR:-./models}
        target: /app/models
        read_only: true
    init: true
    restart: unless-stopped
    stop_grace_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  incident_data:
